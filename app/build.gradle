plugins { id 'com.android.application' }
android {
    namespace 'com.ptribes.newhorizons'
    compileSdk 34
    defaultConfig { applicationId 'com.ptribes.newhorizons'; minSdk 21; targetSdk 34; versionCode 1; versionName '1.0' }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_1_8; targetCompatibility JavaVersion.VERSION_1_8 }
    packaging { resources { excludes += ['META-INF/MANIFEST.MF'] } }
    lint { abortOnError false }
}
dependencies { implementation files('libs/PrehistoricTribes_game.jar') }
